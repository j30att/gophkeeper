openapi: 3.0.3
info:
  title: GophKeeper API
  version: 0.0.1

paths:
  /:
    get:
      tags: ["infra"]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
  /docs:
    get:
      tags: ["infra"]
      summary: Swagger UI
      responses:
        "200":
          description: Swagger UI HTML
          content:
            text/html:
              schema:
                type: string
  /openapi.yml:
    get:
      tags: ["infra"]
      summary: OpenAPI specification
      responses:
        "200":
          description: OpenAPI YAML returned
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/auth/register:
    post:
      tags: ["auth"]
      summary: Register user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: User already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/login:
    post:
      tags: ["auth"]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/secrets:
    post:
      tags: ["secrets"]
      summary: Create JSON secret
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretRequest"
      responses:
        "201":
          description: Secret created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags: ["secrets"]
      summary: List JSON secrets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Secrets returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/secrets/blob:
    post:
      tags: ["secrets"]
      summary: Create blob secret
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - type
                - name
                - file
              properties:
                type:
                  $ref: "#/components/schemas/BlobSecretType"
                name:
                  type: string
                  minLength: 1
                metadata:
                  type: string
                  description: JSON string with user metadata
                  example: '{"site":"example.com"}'
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Blob secret created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/secrets/{id}:
    get:
      tags: ["secrets"]
      summary: Get secret metadata
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SecretID"
      responses:
        "200":
          description: Secret returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: ["secrets"]
      summary: Update JSON secret
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SecretID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecretUpdateRequest"
      responses:
        "200":
          description: Secret updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Secret version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: ["secrets"]
      summary: Delete secret
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SecretID"
      responses:
        "204":
          description: Secret deleted
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Secret not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/secrets/{id}/content:
    get:
      tags: ["secrets"]
      summary: Download blob secret content
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SecretID"
      responses:
        "200":
          description: Blob content returned
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Checksum-SHA256:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Blob not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: ["secrets"]
      summary: Replace blob secret content
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/SecretID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - expected_version
                - file
              properties:
                expected_version:
                  type: integer
                  minimum: 1
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Blob content replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecretResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Blob not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Secret version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    SecretID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthRequest:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 3
          x-oapi-codegen-extra-tags:
            validate: required,min=3
        password:
          type: string
          minLength: 8
          format: password
          x-oapi-codegen-extra-tags:
            validate: required,min=8
    RegisterResponse:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
    LoginResponse:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    SecretType:
      type: string
      enum:
        - credentials
        - card
        - text
        - binary
    StructuredSecretType:
      type: string
      enum:
        - credentials
        - card
    BlobSecretType:
      type: string
      enum:
        - text
        - binary
    SecretRequest:
      type: object
      required:
        - type
        - name
        - payload
      properties:
        type:
          $ref: "#/components/schemas/StructuredSecretType"
        name:
          type: string
          minLength: 1
        metadata:
          type: object
          additionalProperties: true
        payload:
          description: |
            Для type=credentials ожидается CredentialsPayload.
            Для type=card ожидается CardPayload.
          type: object
          additionalProperties: true
    SecretUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/SecretRequest"
        - type: object
          required:
            - expected_version
          properties:
            expected_version:
              type: integer
              minimum: 1
    Blob:
      type: object
      required:
        - id
        - original_name
        - content_type
        - size
        - checksum_sha256
      properties:
        id:
          type: string
          format: uuid
        original_name:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        checksum_sha256:
          type: string
    CredentialsPayload:
      type: object
      required:
        - login
        - password
      properties:
        login:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    CardPayload:
      type: object
      required:
        - number
        - holder
        - expires_at
        - cvv
      properties:
        number:
          type: string
          minLength: 1
        holder:
          type: string
          minLength: 1
        expires_at:
          type: string
          minLength: 1
        cvv:
          type: string
          minLength: 1
    Secret:
      type: object
      required:
        - id
        - user_id
        - type
        - name
        - metadata
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/SecretType"
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        payload:
          type: object
          additionalProperties: true
        blob:
          $ref: "#/components/schemas/Blob"
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SecretListItem:
      type: object
      required:
        - id
        - type
        - name
        - metadata
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/SecretType"
        name:
          type: string
        metadata:
          type: object
          additionalProperties: true
        blob:
          $ref: "#/components/schemas/Blob"
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SecretResponse:
      type: object
      required:
        - secret
      properties:
        secret:
          $ref: "#/components/schemas/Secret"
    SecretListResponse:
      type: object
      required:
        - secrets
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/SecretListItem"
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
    HealthCheckResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
